name: Anodyne C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build code
      run: |
        sudo apt-get install arm-none-eabi-gcc cmake make
        cd src
        mkdir build
        cd build
        cmake ..
        make -j2
        cd ..
        make
