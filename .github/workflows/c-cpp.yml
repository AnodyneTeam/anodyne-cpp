name: Anodyne C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            cmake \
            make

      - name: Build
        run: |
          cd src
          mkdir build
          cd build
          cmake ..
          make -j2

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSYS2 + ARM toolchain
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-x86_64-arm-none-eabi-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Build (MSYS2 shell)
        shell: msys2 {0}
        run: |
          cd src
          mkdir build
          cd build
          cmake -G "Unix Makefiles" ..
          make -j2
