name: Anodyne C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            cmake \
            make

      - name: Build
        run: |
          cd src
          mkdir build
          cd build
          cmake ..
          make -j2

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          git clone https://github.com/AnodyneTeam/arm-none-eabi-win32.git toolchain
          dir toolchain
          dir toolchain/bin
          Add-Content $env:GITHUB_PATH "${{ github.workspace }}/toolchain/bin"
          cd src
          mkdir build
          cd build
          cmake -G "Unix Makefiles" ..
          make -j2
