name: Anodyne C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            arm-none-eabi-gcc \
            arm-none-eabi-binutils \
            cmake \
            make

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make -j2
          cd ..
          make





